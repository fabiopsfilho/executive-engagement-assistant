<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>T&C Engagement Advisor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a1628;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #111d35;
      border-bottom: 1px solid #1e2d4a;
    }
    .header img { height: 20px; width: 20px; }
    .header span { font-size: 12px; font-weight: 600; color: #fff; }
    .status {
      padding: 8px 16px;
      font-size: 11px;
      color: #94a3b8;
      background: #0f1a2e;
      border-bottom: 1px solid #1e2d4a;
    }
    .status .account-name { color: #a78bfa; font-weight: 600; }
    iframe {
      width: 100%;
      height: calc(100vh - 80px);
      border: none;
    }
    .no-account {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 80px);
      text-align: center;
      padding: 24px;
    }
    .no-account h2 { font-size: 16px; color: #fff; margin-bottom: 8px; }
    .no-account p { font-size: 13px; color: #64748b; line-height: 1.5; }
    .detect-btn {
      margin-top: 16px;
      padding: 8px 16px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .detect-btn:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon.svg" alt="icon">
    <span>T&C Engagement Advisor</span>
  </div>
  <div class="status" id="status">
    Navigate to a Salesforce account to get started
  </div>
  <div id="content">
    <div class="no-account">
      <h2>Select an Account</h2>
      <p>Open a customer account in Salesforce (aws-crm.lightning.force.com) and this panel will show T&C engagement insights.</p>
      <button id="detectBtn" class="detect-btn">Detect Current Account</button>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
