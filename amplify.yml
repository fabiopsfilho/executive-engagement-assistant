version: 1
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules
        - npm install
    build:
      commands:
        - echo "VITE_API_URL=https://gy5b6oev95.execute-api.us-east-1.amazonaws.com/prod" > .env
        - npx vite build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
